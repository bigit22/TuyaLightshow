[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuyalight"
version = "0.2.0"
description = "TuyaLightshow - Music-reactive lightshow for Tuya RGB LED strips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "tinytuya",
    "soundcard",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "PyQt6>=6.6",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pyinstaller"
]

[project.scripts]
tuyalight = "tuyalight.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "S110", "PYI034"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "silent"
